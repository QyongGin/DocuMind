# 평가 실행(M1 12번 베이스라인, 13번 모델 비교) 때만 쓰는 덮어쓰기 파일.
# ai-server를 데스크탑 안쪽 주소 127.0.0.1:18000에만 연다. ai-server는 인증이 없어 랜·tailnet에 열지 않고,
# 맥북 실행기(evalset run)는 SSH 터널로 부른다. 절차: docs/development/local-gpu/평가-실행-절차.md
# 사용: docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.eval.yml --env-file .env up -d --build
# 평가가 끝나면 이 파일 없이 다시 up 해 포트를 닫는다.
services:
  ai-server:
    ports:
      - "127.0.0.1:${EVAL_AI_PORT:-18000}:8000"
