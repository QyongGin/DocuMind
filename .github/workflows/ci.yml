# PR마다 바뀐 모듈의 테스트를 돌린다(이슈 #146, ADR-0024).
# 학교 데이터(Assets/)·GPU·Ollama·Chroma 서버 없이 돈다. 테스트는 모두 가나대학 합성 데이터와 메모리 DB를 쓴다.
# 브랜치 규칙의 필수 검사는 마지막 'ci-ok' 하나다. 바뀌지 않은 모듈의 잡은 건너뛰고(skipped), ci-ok가 결과를 모은다.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # edited: PR 제목·본문을 고치면 PR 규칙 검사를 다시 한다(모듈 테스트도 함께 다시 돌아 ci-ok가 한 실행의 결과만 모은다)
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 바뀐 모듈 찾기
    runs-on: ubuntu-latest
    outputs:
      corpus: ${{ steps.diff.outputs.corpus }}
      train: ${{ steps.diff.outputs.train }}
      ai: ${{ steps.diff.outputs.ai }}
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: 바뀐 경로로 모듈 고르기
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # 수동 실행이거나 이 워크플로를 고친 PR이면 모든 모듈을 돌린다.
          if [ -z "$BASE" ]; then
            files="tools/corpus/ tools/train/ ai-server/ backend/ frontend/"
          else
            files=$(git diff --name-only "$BASE"...HEAD)
          fi
          echo "$files"
          all=false
          echo "$files" | grep -q '^\.github/workflows/' && all=true
          pick() { if [ "$all" = true ] || echo "$files" | grep -q "^$1"; then echo true; else echo false; fi; }
          {
            echo "corpus=$(pick tools/corpus/)"
            echo "train=$(pick tools/train/)"
            echo "ai=$(pick ai-server/)"
            echo "backend=$(pick backend/)"
            echo "frontend=$(pick frontend/)"
          } >> "$GITHUB_OUTPUT"

  corpus:
    name: 수집기·평가셋 도구 (tools/corpus)
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/corpus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/corpus/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  train:
    name: 학습 도구 (tools/train)
    needs: changes
    if: needs.changes.outputs.train == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/train
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 학습 라이브러리(GPU)는 학습 서버에서만 깐다. CI는 데이터 변환만 시험한다
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ai-server:
    name: AI 서버 (ai-server)
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-server/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  backend:
    name: 백엔드 (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

  frontend:
    name: 프론트엔드 (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pr-rules:
    name: PR 규칙 (제목·이슈 연결·크기)
    # CONTRIBUTING.md 0·2·6장. 제목 형식과 이슈 연결이 없으면 실패, 크기와 브랜치 이름은 경고만
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 검사 스크립트 테스트
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: 제목 형식과 이슈 연결(없으면 실패), 크기와 브랜치 이름(경고)
        # 제목·본문은 셸에 끼워 넣지 않고 환경 변수로만 넘긴다
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check_pr_rules.py

  ci-ok:
    name: ci-ok
    needs: [changes, corpus, train, ai-server, backend, frontend, pr-rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 모듈 잡과 PR 규칙 결과 모으기(실패·취소가 하나라도 있으면 실패)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
