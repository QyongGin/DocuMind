# PR마다 바뀐 모듈의 테스트를 돌린다(이슈 #146, ADR-0024).
# 학교 데이터(Assets/)·GPU·Ollama·Chroma 서버 없이 돈다. 테스트는 모두 가나대학 합성 데이터와 메모리 DB를 쓴다.
# 브랜치 규칙의 필수 검사는 마지막 'ci-ok' 하나다. 바뀌지 않은 모듈의 잡은 건너뛰고(skipped), ci-ok가 결과를 모은다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 바뀐 모듈 찾기
    runs-on: ubuntu-latest
    outputs:
      corpus: ${{ steps.diff.outputs.corpus }}
      ai: ${{ steps.diff.outputs.ai }}
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: 바뀐 경로로 모듈 고르기
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # 수동 실행이거나 이 워크플로를 고친 PR이면 모든 모듈을 돌린다.
          if [ -z "$BASE" ]; then
            files="tools/corpus/ ai-server/ backend/ frontend/"
          else
            files=$(git diff --name-only "$BASE"...HEAD)
          fi
          echo "$files"
          all=false
          echo "$files" | grep -q '^\.github/workflows/' && all=true
          pick() { if [ "$all" = true ] || echo "$files" | grep -q "^$1"; then echo true; else echo false; fi; }
          {
            echo "corpus=$(pick tools/corpus/)"
            echo "ai=$(pick ai-server/)"
            echo "backend=$(pick backend/)"
            echo "frontend=$(pick frontend/)"
          } >> "$GITHUB_OUTPUT"

  corpus:
    name: 수집기·평가셋 도구 (tools/corpus)
    needs: changes
    if: needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/corpus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/corpus/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ai-server:
    name: AI 서버 (ai-server)
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-server/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  backend:
    name: 백엔드 (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

  frontend:
    name: 프론트엔드 (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ci-ok:
    name: ci-ok
    needs: [changes, corpus, ai-server, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 모듈 잡 결과 모으기(실패·취소가 하나라도 있으면 실패)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
