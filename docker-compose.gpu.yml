# NVIDIA GPU 전용 오버라이드 파일.
# 사용 전 host에서 nvidia-smi와 `docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi`가 모두 성공해야 한다.
# 사용법: docker compose -f docker-compose.yml -f docker-compose.gpu.yml --env-file .env up --build -d
# 맥북 Docker Desktop에서는 NVIDIA GPU passthrough가 안 되므로 사용하지 않는다.

# 모델 준비 단계(ADR-0036): 이미 등록된 모델은 내려받지 않는다. 없을 때만 Ollama 공개 목록에서 내려받는다.
# 공개 목록에 없는 모델(A.X 4.0 Light, 학습한 모델)은 deploy/models/README.md 절차로 먼저 등록한다.
# 이미 있는 모델을 다시 받지 않으므로 공개 목록의 같은 이름이 새 판으로 바뀌어도 조용히 바뀌지 않는다.
x-ollama-model-prep: &ollama-model-prep
  image: ollama/ollama:latest
  depends_on:
    ollama:
      condition: service_healthy
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      if ollama show "$$MODEL" > /dev/null 2>&1; then
        echo "등록돼 있음, 내려받지 않음: $$MODEL"
      elif ollama pull "$$MODEL"; then
        echo "내려받음: $$MODEL"
      else
        echo "모델을 준비하지 못함: $$MODEL — 공개 목록에 없는 모델이면 deploy/models/README.md 절차로 먼저 등록한다" >&2
        exit 1
      fi

services:
  ai-server:
    depends_on:
      ollama:
        condition: service_healthy
      ollama-embedding-model:
        condition: service_completed_successfully
      ollama-llm-model:
        condition: service_completed_successfully

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-embedding-model:
    <<: *ollama-model-prep
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}

  ollama-llm-model:
    <<: *ollama-model-prep
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_LLM_MODEL:-ax40light:q4km}

  # 재순위 서버(M2 3단계, #174). Hugging Face TEI가 POST /rerank로 순위 융합 후보를 다시 매긴다.
  # 기본은 꺼짐: 켜려면 compose 명령에 --profile reranker 를 붙이고 .env에 AI_RERANKER_URL=http://reranker:80 을 적는다.
  # AI 서버는 이 서버에 의존하지 않는다(응답이 없으면 순위 융합 순서로 답한다).
  # 이미지 태그는 GPU 세대마다 다르다(RTX 40 계열 89-1.9, A10·A10G 86-1.9). 모델은 리비전을 고정해 같은 점수를 재현한다.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:${RERANKER_IMAGE_TAG:-89-1.9}
    profiles: ["reranker"]
    restart: unless-stopped
    command:
      - "--model-id"
      - "${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}"
      - "--revision"
      - "${RERANKER_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}"
    expose:
      - "80"
    volumes:
      - reranker_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  reranker_data:
