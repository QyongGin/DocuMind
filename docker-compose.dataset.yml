# 데이터셋용 색인(M1 9번, 이슈 #128, ADR-0038) 스택 덮어쓰기 파일.
# 서비스와 같은 코드(백엔드·AI 서버)로 학습 몫 문서만 따로 색인해, 학습 질문에 운영과 같은 모양의 근거를 붙인다.
# 프로젝트 이름은 늘 documind_dataset — DB·색인 볼륨(documind_dataset_*)이 서비스와 따로 생긴다.
# 사용(데스크탑): docker compose --project-name documind_dataset -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.dataset.yml --env-file .env up -d --build
# 서비스 스택(documind_desktop)을 멈춘 뒤 올린다 — GPU와 모델 볼륨을 함께 쓰므로 한 번에 한 스택만 띄운다.
# 절차: docs/development/local-gpu/데이터셋-색인-절차.md
services:
  # 화면은 띄우지 않는다(서비스 스택과 80 포트가 겹친다). 업로드·검색은 아래 포트로 SSH 터널을 거쳐 부른다
  frontend:
    profiles: ["service-only"]
  backend:
    ports:
      - "127.0.0.1:${DATASET_BACKEND_PORT:-18180}:8080"
  ai-server:
    ports:
      - "127.0.0.1:${DATASET_AI_PORT:-18100}:8000"
  # 학습 예시 초안 모델(ADR-0040)을 맥북의 `corpus trainset`이 부른다
  ollama:
    ports:
      - "127.0.0.1:${DATASET_OLLAMA_PORT:-11535}:11434"

volumes:
  # 모델은 서비스 스택이 받아 둔 볼륨을 그대로 쓴다(A.X 등록·임베딩 모델을 다시 받지 않음)
  ollama_data:
    external: true
    name: documind_desktop_ollama_data
